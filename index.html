<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitter Video Upload</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container mt-5">
  <div class="card">
    <div class="card-header">
      <h4>Upload a Video</h4>
    </div>
    <div class="card-body">
      <form id="video-upload-form" enctype="multipart/form-data">
        <div class="form-group">
          <label for="videoUpload">Choose Video (Max: 10MB, Formats: MP4, MOV)</label>
          <input type="file" id="videoUpload" name="video" accept="video/mp4, video/mov" class="form-control" required>
        </div>
        <div class="form-group">
          <button type="submit" class="btn btn-primary">Upload Video</button>
        </div>
        <div class="progress mt-3">
          <div id="upload-progress" class="progress-bar progress-bar-striped" role="progressbar" style="width: 0%;">
            0%
          </div>
        </div>
        <div id="upload-feedback" class="text-danger mt-2"></div>
      </form>
    </div>
  </div>
</div>

<!-- Bootstrap JS, jQuery, and your custom script -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="script.js"></script>
</body>
</html>
