
<div class="post-details" *ngIf="showCommentPopup">
  <!-- Post Header -->

<div *ngFor="let comment of comments" class="comment">
<img src="https://i.postimg.cc/sxgbZMKr/308235608-1828835600792055-2550874922322187932-n.jpg" alt="" class="comment-avatar">
<div class="comment-text-container">
  <span class="username">{{this.username }}</span>

  <span class="comment-text">{{ comment }}</span>
</div>
</div>
