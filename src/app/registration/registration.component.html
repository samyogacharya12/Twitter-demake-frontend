<div class="registration-form ">
    <div class="registrationl header">
      <h1 class="title"><b>Create your Own</b></h1>

    </div>
  <div class="registration">
  <form class="twitter-form" (ngSubmit)="onSubmit()" #userForm="ngForm">
      <input class="username-btn" type="text" placeholder="UserName" [(ngModel)]="user.username" (keydown)="onSelectUsername()" name="name" required><br><br><br>
      <div *ngIf="checkUsername" class="email-error-message ">
        Please enter a valid username length.
      </div>
     
      <input class="email-input" type="text" placeholder="Email" [(ngModel)]="user.email" (keydown)="validateEmail($event)" name="email" required><br>
      <div *ngIf="isInvalidEmail" class="email-error-message ">
        Please enter a valid email address.
      </div>
      <input class="username-btn" type="text" placeholder="Full Name" [(ngModel)]="user.full_name" name="full_name" required><br>
      <br>
      <br>
      <input class="username-btn" type="password" placeholder="Password" [(ngModel)]="user.password" (keydown)="onSelectPassword()" name="password" required><br>
      <div *ngIf="isInvalidPassword" class="email-error-message ">
        <br>
        <br>
        Please enter a valid password.
      </div>


    <div class="form-group dob-group">
      <select id="dob-month" [(ngModel)]="user.dobMonth" name="dobMonth" required>
        <option value="" disabled selected>Month</option>
        <option *ngFor="let month of months" [value]="month">{{ month }}</option>
      </select>

      <select id="dob-day" [(ngModel)]="user.dobDay" name="dobDay" required>
        <option value="" disabled selected>Day</option>
        <option *ngFor="let day of days" [value]="day">{{ day }}</option>
      </select>

      <select id="dob-year" [(ngModel)]="user.dobYear" name="dobYear" required>
        <option value="" disabled selected>Year</option>
        <option *ngFor="let year of years" [value]="year">{{ year }}</option>
      </select>
    </div>

    <div class="form-group">
        <button type="submit" class="submit-btn" [disabled]="!userForm.form.valid">Save</button>
    </div>
  </form>
</div>


  <!-- Popup Modal -->
  <div class="modal" *ngIf="showSignUpModal">
    <div class="modal-content">
      <div class="close-button" (click)="closeSignUpPopup()">✖</div>
      <h2>Registration Successful!</h2>
      <p>Your account has been created successfully.</p>
    </div>
  </div>
</div>
